name: SpiderFuzz CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: spiderfuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-fuzz:
    name: Fetch SpiderMonkey JS shell and full 2-hour fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 135

    steps:
      - name: Checkout SpiderFuzz
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install fuzzfetch
        run: python -m pip install --upgrade fuzzfetch

      - name: Fetch Linux ASan fuzzing JS shell
        run: |
          python -m fuzzfetch \
            --target js \
            --os Linux \
            --cpu x86_64 \
            --asan \
            --fuzzing \
            --name spiderfox-js \
            --out "$GITHUB_WORKSPACE/js-shell"
          JS=$(find "$GITHUB_WORKSPACE/js-shell" -type f -name js -perm -111 -print -quit)
          test -n "$JS"
          echo "path=$JS" >> "$GITHUB_OUTPUT"
          "$JS" --version
        id: js-shell

      - name: Build SpiderFuzz
        run: dotnet build --configuration Release

      - name: Run full 2-hour ASan fuzzing
        run: |
          mkdir -p ci-output
          set +e
          timeout --signal=TERM --kill-after=2m 2h \
            dotnet run --project SpiderFuzz --configuration Release -- \
              --js "${{ steps.js-shell.outputs.path }}" \
              --timeout 5000 \
              --no-minimize \
              --no-resume \
              --workers "$(nproc)" \
              --output ci-output
          status=$?
          set -e
          # timeout(1) returns 124 when the planned two-hour run ends.
          # Any other exit code is a real fuzzer or infrastructure failure.
          if [ "$status" -ne 124 ]; then
            echo "SpiderFuzz exited unexpectedly with status $status"
            exit "$status"
          fi

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spiderfuzz-ci-output
          path: ci-output/
          if-no-files-found: ignore
          retention-days: 14
